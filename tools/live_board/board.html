<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duck live</title>
<!--
Live board for the booth Mac. Put this file next to the recorded videos (iCloud media folder)
and open it full screen. Query: ?src=<data server URL>&script=kana (default: kanji with ruby)
Data: <src>/status.json and <src>/clips/<file> (tools/live_board/server.py behind tailscale serve).
When the data cannot be fetched (3 misses in a row) or is older than 30 minutes, the recorded
videos next to this file play instead; the board comes back as soon as data is fresh again.
-->
<style>
  :root { --bg: #151a18; --fg: #f3f5f2; --dim: #8f9a94; --accent: #e2551b; --line: #2a322e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Hiragino Sans", sans-serif; }
  #board { display: grid; grid-template-columns: 1fr 30vw; height: 100vh; }
  #stage { position: relative; background: #000; display: flex; align-items: center; }
  #stage video { width: 100%; height: 100%; object-fit: contain; }
  #side { display: flex; flex-direction: column; padding: 5vh 2.6vw 4vh; gap: 4.5vh; border-left: 1px solid var(--line); }
  #live { display: flex; align-items: center; gap: .6em; font-size: 2.2vw; color: var(--dim); }
  #live i { width: .7em; height: .7em; border-radius: 50%; background: var(--accent); animation: blink 1.6s infinite; }
  #live.done i { background: var(--dim); animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .big { font-size: 4vw; line-height: 1.3; font-weight: 700; white-space: nowrap; }
  .mid { font-size: 2.2vw; line-height: 1.5; white-space: nowrap; }
  .dim { color: var(--dim); }
  rt { font-size: .45em; color: var(--dim); }
  #curve { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1vh; }
  #curve .mid { color: var(--dim); }
  #curve svg { flex: 1 1 0; width: 100%; height: 0; }
  #fallback { position: fixed; inset: 0; background: #000; display: none; }
  #fallback video { width: 100%; height: 100%; object-fit: contain; }
  body.offline #fallback { display: block; }
</style>
</head>
<body>
<div id="board">
  <div id="stage"><video id="clip" muted playsinline autoplay></video></div>
  <div id="side">
    <div id="live"><i></i><span id="live-text"></span></div>
    <div id="summary">
      <div class="big" id="clock"></div>
      <div class="mid dim" id="de"></div>
      <div class="big" id="days"></div>
      <div class="mid dim" id="did"></div>
    </div>
    <div id="curve">
      <div class="mid" id="curve-title"></div>
      <svg id="svg" viewBox="0 0 400 300" preserveAspectRatio="none" role="img"></svg>
    </div>
  </div>
</div>
<div id="fallback"><video id="rec" muted playsinline></video></div>
<script>
const q = new URLSearchParams(location.search);
const SRC = (q.get("src") || (location.protocol.startsWith("http") ? location.origin : "https://cosmic-explorer-node.tail4c00fe.ts.net")).replace(/\/$/, "");
const KANJI = q.get("script") !== "kana";  // kanji with ruby by default (user, 11-28)
const POLL_MS = 30000, MISSES = 3, STALE_S = 30 * 60;
const RECORDED = KANJI
  ? ["yumetamago_race_20261127_kanji.mp4", "yumetamago_crowd_20261128_kanji.mp4"]
  : ["yumetamago_race_20261127.mp4", "yumetamago_crowd_20261128.mp4"];

// {base|ruby} -> <ruby> in kanji mode, base only... kana strings carry no markup.
const T = KANJI ? {
  live: "いま {練習中|れんしゅうちゅう}", done: "{練習|れんしゅう} おわり", de: "で",
  h: "{時間|じかん}", days: (d) => `${d}{日分|にちぶん}`, did: "{練習|れんしゅう}した", curve: "{上手|じょうず}さ",
} : {
  live: "いま れんしゅうちゅう", done: "れんしゅう おわり", de: "で",
  h: "じかん", days: (d) => `${d}にちぶん`, did: "れんしゅうした", curve: "じょうずさ",
};
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const ruby = (s) => esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
const fun = (m) => ([2, 5, 7, 9].includes(m % 10) ? "ふん" : "ぷん");
function clockText(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const mm = KANJI ? `${m}{分|${fun(m)}}` : `${m}${fun(m)}`;
  if (!h) return mm;
  return `${h}${T.h}${m ? mm : ""}`;
}
const $ = (id) => document.getElementById(id);

let status = null, misses = 0, shownClip = null, recIdx = 0;

function minutesNow(st) {
  const finished = st.total_steps && st.latest_step >= st.total_steps;
  if (finished || !st.started_at) return st.latest_minutes;
  return Math.max(st.latest_minutes, Math.floor((Date.now() / 1000 - st.started_at) / 60));
}

function drawCurve(st) {
  const pts = st.curve || [];
  const svg = $("svg");
  if (!pts.length) { svg.innerHTML = ""; return; }
  const xMax = Math.max(st.total_steps || 0, pts[pts.length - 1][0]) || 1;
  const yMax = Math.max(...pts.map((p) => p[1]), 1) * 1.1;
  const X = (s) => 8 + (s / xMax) * 384, Y = (v) => 292 - (Math.max(v, 0) / yMax) * 284;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = pts[pts.length - 1];
  svg.innerHTML =
    `<line x1="8" y1="292" x2="392" y2="292" stroke="#2a322e" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<path d="${d}" fill="none" stroke="#f3f5f2" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
    `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="6" fill="#e2551b"/>`;
  svg.setAttribute("aria-label", `${T.curve.replace(/\{([^|}]+)\|[^}]+\}/g, "$1")}: ${last[1]}`);
}

function render() {
  const st = status;
  if (!st) return;
  const finished = st.total_steps && st.latest_step >= st.total_steps;
  $("live").classList.toggle("done", !!finished);
  $("live-text").innerHTML = ruby(finished ? T.done : T.live);
  $("clock").innerHTML = ruby(clockText(minutesNow(st)));
  $("de").innerHTML = ruby(T.de);
  $("days").innerHTML = ruby(T.days(Math.floor(st.practice_days)));
  $("did").innerHTML = ruby(T.did);
  $("curve-title").innerHTML = ruby(T.curve);
  drawCurve(st);
  const latest = st.clips.length ? st.clips[st.clips.length - 1].file : null;
  const v = $("clip");
  if (latest && !shownClip) playClip(latest);
  v.dataset.next = latest || "";
}

function playClip(file) {
  const v = $("clip");
  shownClip = file;
  v.src = `${SRC}/clips/${file}`;
  v.play().catch(() => {});
}
// Swap to a newer clip only at the end of a loop so a run is never cut mid-way.
$("clip").addEventListener("ended", () => {
  const v = $("clip"), next = v.dataset.next;
  if (next && next !== shownClip) playClip(next);
  else { v.currentTime = 0; v.play().catch(() => {}); }
});

function setOffline(off) {
  if (off === document.body.classList.contains("offline")) return;
  document.body.classList.toggle("offline", off);
  const r = $("rec");
  if (off) { playRecorded(); $("clip").pause(); }
  else { r.pause(); r.removeAttribute("src"); r.load(); $("clip").play().catch(() => {}); }
}
function playRecorded() {
  const r = $("rec");
  r.src = RECORDED[recIdx % RECORDED.length];
  r.play().catch(() => {});
}
$("rec").addEventListener("ended", () => { recIdx++; playRecorded(); });
$("rec").addEventListener("error", () => { recIdx++; setTimeout(playRecorded, 2000); });

async function poll() {
  try {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 8000);
    const r = await fetch(`${SRC}/status.json`, { cache: "no-store", signal: ac.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    status = await r.json();
    misses = 0;
    const stale = Date.now() / 1000 - status.updated_at > STALE_S;
    setOffline(stale || !status.clips.length);
    render();
  } catch (e) {
    misses++;
    if (misses >= MISSES || !status) setOffline(true);
  }
}
poll();
setInterval(poll, POLL_MS);
setInterval(render, 20000);  // keep the clock moving between polls
</script>
</body>
</html>
